<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spine 动画预览</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#e7edf8;background:#161a23}*{box-sizing:border-box}body{margin:0;display:flex;flex-direction:column;height:100vh}header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #303748;flex-wrap:wrap;background:#202633}strong{font-size:15px;margin-right:8px}button,select{background:#30394d;border:1px solid #48516a;color:#eef3ff;border-radius:6px;padding:6px 10px;font:inherit;font-size:12px}button{cursor:pointer}button:hover{background:#40516b}label{display:flex;align-items:center;gap:6px;font-size:12px;color:#b7c2d8}input[type=range]{width:90px;accent-color:#69b8fc}#stage{position:relative;flex:1;min-height:0;background-color:#191f2b;background-image:linear-gradient(45deg,#252c39 25%,transparent 25%),linear-gradient(-45deg,#252c39 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#252c39 75%),linear-gradient(-45deg,transparent 75%,#252c39 75%);background-size:28px 28px;background-position:0 0,0 14px,14px -14px,-14px 0}canvas{display:block;width:100%;height:100%;cursor:grab}#empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:30px;pointer-events:none;color:#bac6db;line-height:1.9}#empty b{font-size:22px;color:#e7edf8}footer{padding:9px 16px;font-size:12px;display:flex;justify-content:space-between;gap:16px;border-top:1px solid #303748;background:#202633}#status.error{color:#ff9999}#status.ok{color:#9be3bc}#timeline{width:150px}#clock{min-width:90px}#file,#folder{display:none}#note{font-size:11px;color:#8e9bb3} @media(max-width:650px){header{gap:6px;padding:8px}#note{display:none}#timeline{width:90px}}
</style></head><body>
<header><strong>Spine 动画预览</strong><button id="open">打开素材</button><button id="locate">选择配套文件夹</button><label>动作<select id="animation"></select></label><label>皮肤<select id="skin"></select></label><button id="play">暂停</button><label>速度<select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><label><input id="loop" type="checkbox" checked>循环</label><button id="thumbnail" title="将当前动作设为列表中循环播放的缩略图">生成动态缩略图</button><button id="fit">适应窗口</button><label><input id="pma" type="checkbox">PMA</label><input id="timeline" type="range" min="0" max="1" step="0.001" value="0"><span id="clock">0.00 / 0.00s</span></header>
<div id="stage"><canvas id="canvas"></canvas><div id="empty"><b>Spine 3.6–4.3 动画预览</b><span>打开 ZIP 素材包，或同时选择骨骼、图集和贴图。<br>拖动平移 · 滚轮缩放 · 支持动作切换与暂停</span></div></div>
<footer><span id="status">等待素材</span><span id="note">v1.0.0 · 本地播放</span></footer>
<input id="file" type="file" multiple accept=".zip,.spinezip,.skel,.bytes,.json,.atlas,.txt,.png,.jpg,.jpeg,.webp"><input id="folder" type="file" webkitdirectory multiple>
<script src="formats.js"></script><script src="worker-bootstrap.js"></script><script src="vendor/spine-webgl.js"></script><script src="binary36.js"></script><script src="runtimes.js"></script><script src="viewer.js?v=0.2.1"></script>
</body></html>
